<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tra cứu đơn hàng Shopee – Minh Quý</title>

  <style>
    /* ===== BACKGROUND GIÁNG SINH ===== */
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #b91c1c 0%, #7f1d1d 35%, #111827 100%);
      color: #f9fafb;
      overflow-x: hidden;
    }

    /* ===== TUYẾT RƠI ===== */
    .snow {
      position: fixed;
      top: -20px;
      pointer-events: none;
      animation: fall linear forwards;
      color: white;
      z-index: 9999;
    }

    @keyframes fall {
      to {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* ===== CÂY THÔNG 2 BÊN ===== */
    .tree-left, .tree-right {
      position: fixed;
      width: 130px;
      bottom: 20px;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.8));
      z-index: 9000;
      animation: pulse 2.4s infinite ease-in-out;
    }

    .tree-left { left: 25px; }
    .tree-right { right: 25px; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    /* ===== DÂY ĐÈN NOEL ===== */
    .christmas-lights {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      pointer-events: none;
      z-index: 99999;
    }

    .christmas-lights span {
      width: 16px;
      height: 26px;
      border-radius: 50%;
      background: red;
      margin-top: 10px;
      animation: blink 1.4s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.9));
    }

    .christmas-lights span:nth-child(odd) { animation-duration: 1s; }
    .christmas-lights span:nth-child(3n) { animation-duration: 1.8s; }

    @keyframes blink {
      0% {
        transform: translateY(0px) scale(1);
        opacity: 0.5;
        background: #ef4444;
      }
      50% {
        transform: translateY(6px) scale(1.15);
        opacity: 1;
        background: #facc15;
      }
      100% {
        transform: translateY(0px) scale(1);
        opacity: 0.6;
        background: #4ade80;
      }
    }

    /* ===== CONTAINER ===== */
    #container {
      max-width: 1050px;
      margin: 50px auto;
      background: rgba(15,23,42,0.96);
      padding: 30px 40px;
      border-radius: 20px;
      border: 4px solid #facc15;
      box-shadow: 0 0 40px rgba(248,250,252,0.2);
    }

    .logo-img {
      width: 120px;
      display: block;
      margin: 0 auto 15px;
      border-radius: 999px;
      box-shadow: 0 0 25px rgba(255,255,255,0.35);
    }

    h2 {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin: 10px 0 20px;
      color: #fef08a;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    textarea {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      color: white;
      border-radius: 10px;
      border: 2px solid #fca5a5;
      font-size: 15px;
      resize: vertical;
    }

    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
    }

    .btn-zalo {
      padding: 12px 24px;
      background: #0284c7;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 5px 18px rgba(0, 150, 255, 0.5);
      transition: .2s;
    }
    .btn-zalo:hover { transform: translateY(-2px); }

    .btn-check {
      padding: 12px 28px;
      background: #ff5722;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 87, 34, 0.45);
      transition: .2s;
    }

    .btn-check:hover { transform: translateY(-2px); }

    #status {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      overflow: hidden;
    }

    thead { background: rgba(255,255,255,0.15); }

    th, td {
      padding: 12px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
    }

    tr:hover { background: rgba(255,255,255,0.07); }

    img.productImg {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="christmas-lights">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Christmas_tree_icon.png" class="tree-left" />
  <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Christmas_tree_icon.png" class="tree-right" />

  <script>
    function createSnow() {
      const snow = document.createElement("div");
      snow.classList.add("snow");
      const snowChars = ["✼","✽","✾","✿","❉","❊","✻","✺","✹","✵","✴"];
      snow.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
      snow.style.left = Math.random() * window.innerWidth + "px";
      snow.style.animationDuration = 2 + Math.random() * 4 + "s";
      snow.style.opacity = Math.random() * 0.9 + 0.1;
      snow.style.fontSize = Math.random() * 12 + 10 + "px";
      document.body.appendChild(snow);
      setTimeout(() => snow.remove(), 8000);
    }
    setInterval(createSnow, 60);
  </script>

  <div id="container">
    <img src="./logo.png" class="logo-img" alt="logo">

    <p style="text-align:center;margin:0;">❤️ <b>Chung tay ủng hộ đồng bào vùng lũ miền Trung</b> ❤️</p>
    <p style="text-align:center;margin:6px 0 20px;">
      <b>Số tài khoản:</b> 8888881010 – <b>VCB</b><br>
      Mặt Trận Tổ Quốc Việt Nam – Ban Cứu Trợ Trung Ương
    </p>

    <h2>Tra cứu đơn hàng Shopee – Minh Quý 🎄</h2>

    <textarea id="cookieBox" rows="6" placeholder="Dán cookie SPC_ST=... vào đây"></textarea>

    <div class="btn-row">
      <a href="https://zalo.me/g/rsasqo212" class="btn-zalo">Nhóm ZALO Đặt Đơn</a>
      <button onclick="go()" class="btn-check">Check</button>
    </div>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <script>
    async function go() {
      const cookies = document.getElementById("cookieBox").value
        .split(/\r?\n/)
        .map(s => s.trim())
        .filter(Boolean);

      const status = document.getElementById("status");
      const result = document.getElementById("result");

      status.textContent = "Đang lấy đơn...";
      result.innerHTML = "";

      const res = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cookies })
      });

      let data;
      try {
        data = await res.json();
      } catch {
        status.textContent = "Lỗi: Server không trả JSON.";
        return;
      }

      if (!res.ok) {
        status.textContent = "Lỗi: " + (data.error || "unknown");
        return;
      }

      status.textContent = `Có ${data.count - 1} đơn`;

      const rows = (data.orders || []).map(o => `
        <tr>
          <td>${o.stt}</td>
          <td>${o.mvd}</td>
          <td>${o.status}</td>
          <td>${o.receiver}</td>
          <td>${o.receiverPhone}</td>
          <td title="${o.address}">${o.address}</td>
          <td>${o.productImg ? `<img src="${o.productImg}" class="productImg"/>` : "—"}</td>
          <td>${o.shipperName || "—"}</td>
          <td>${o.shipperPhone || "—"}</td>
        </tr>
      `).join("");

      result.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>STT</th>
              <th>MVĐ</th>
              <th>Trạng thái</th>
              <th>Người nhận</th>
              <th>SĐT nhận</th>
              <th>Địa chỉ</th>
              <th>SP</th>
              <th>Tên shipper</th>
              <th>SĐT ship</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
  </script>

</body>
</html>
