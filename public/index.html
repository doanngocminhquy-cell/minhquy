<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Tra cứu đơn hàng Shopee – Minh Quý</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <!-- DÂY ĐÈN -->
  <div class="christmas-lights">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- DÀN LỒNG ĐÈN TREO -->
  <div class="lantern-row" aria-hidden="true">
    <div class="lantern"></div><div class="lantern"></div><div class="lantern"></div>
    <div class="lantern"></div><div class="lantern"></div><div class="lantern"></div>
    <div class="lantern"></div><div class="lantern"></div><div class="lantern"></div>
  </div>

  <!-- LỒNG ĐÈN 2 BÊN -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Red_lantern_icon.svg/512px-Red_lantern_icon.svg.png" class="tree-left" />
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Red_lantern_icon.svg/512px-Red_lantern_icon.svg.png" class="tree-right" />

  <!-- LÌ XÌ + MAI + ĐÀO -->
  <script>
    function createLiXi() {
      const el = document.createElement("div");
      el.className = "lixi";
      const chars = ["福","禄","寿","TẾT","LỘC","PHÁT","TÀI"];
      el.style.setProperty("--char", `"${chars[Math.floor(Math.random()*chars.length)]}"`);
      el.style.left = Math.random() * window.innerWidth + "px";
      el.style.animationDuration = (3 + Math.random() * 5) + "s";
      el.style.transform = `rotate(${Math.random()*40-20}deg) scale(${0.85+Math.random()*0.6})`;
      el.style.opacity = 0.55 + Math.random()*0.45;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 10000);
    }

    function createFlower(type){
      const el = document.createElement("div");
      el.className = type === "mai" ? "flower-mai" : "flower-dao";
      el.style.left = Math.random() * window.innerWidth + "px";
      el.style.animationDuration = (6 + Math.random()*6) + "s";
      el.style.transform = `scale(${0.6+Math.random()*0.6}) rotate(${Math.random()*360}deg)`;
      el.style.opacity = 0.4 + Math.random()*0.6;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 15000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      setInterval(createLiXi, 400);          // lì xì 20%
      setInterval(()=>createFlower("mai"),1400);
      setInterval(()=>createFlower("dao"),1800);
    });
  </script>

  <!-- MAIN -->
  <div id="container">
    <img src="./logo.png" class="logo-img" />

    <p style="text-align:center;margin:0;">❤️ <b>Chung tay ủng hộ đồng bào vùng lũ miền Trung</b> ❤️</p>
    <p style="text-align:center;margin:6px 0 20px;">
      <b>Số tài khoản:</b> 8888881010 – <b>VCB</b><br>
      Mặt Trận Tổ Quốc Việt Nam – Ban Cứu Trợ Trung Ương
    </p>

    <h2>Tra cứu đơn hàng Shopee – Minh Quý 🧧</h2>

    <textarea id="cookieBox" rows="6" placeholder="Dán cookie SPC_ST=... vào đây"></textarea>

    <div class="btn-row">
      <a href="https://zalo.me/g/rsasqo212" class="btn-zalo">Nhóm ZALO Đặt Đơn</a>
      <button onclick="go()" class="btn-check">Check</button>
    </div>

    <div id="status"></div>
    <div id="result"></div>
  </div>

  <!-- LOGIC CHECK -->
  <script>
    async function go(){
      const cookies=document.getElementById("cookieBox").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const status=document.getElementById("status");
      const result=document.getElementById("result");
      status.textContent="Đang lấy đơn...";
      result.innerHTML="";
      const res=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cookies})});
      const data=await res.json();
      status.textContent=`Có ${data.count-1} đơn`;
      result.innerHTML=`<table><thead><tr>
        <th>STT</th><th>MVĐ</th><th>Trạng thái</th><th>Người nhận</th>
        <th>SĐT nhận</th><th>Địa chỉ</th><th>SP</th><th>Shipper</th><th>SĐT ship</th>
      </tr></thead><tbody>`+
      data.orders.map(o=>`<tr>
        <td>${o.stt}</td><td>${o.mvd}</td><td>${o.status}</td>
        <td>${o.receiver}</td><td>${o.receiverPhone}</td>
        <td>${o.address}</td>
        <td>${o.productImg?`<img src="${o.productImg}" class="productImg">`:"—"}</td>
        <td>${o.shipperName||"—"}</td><td>${o.shipperPhone||"—"}</td>
      </tr>`).join("")+
      "</tbody></table>";
    }
  </script>

  <!-- ADCASH SAFE -->
  <script>
    if (window.aclib?.runAutoTag) {
      aclib.runAutoTag({ zoneId: "wfbsexymx9" });
    }
  </script>

</body>
</html>
